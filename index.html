<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ผจญภัยโลกดิจิทัล ตะลุยด่านพิชิตภารกิจ</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg1:#5ad1ff;--bg2:#b388ff;--card:#fff;--ink:#1d2b4f;--pri:#ff7a1a;--ok:#2bb673;--bad:#ef476f}
*{box-sizing:border-box}
body{margin:0;font-family:Kanit,"Noto Sans Thai",sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;min-height:100vh}
#app{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:1.5rem;text-align:center;margin:.3em 0;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.card{background:var(--card);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 6px 0 rgba(0,0,0,.18)}
button,select,input{font:inherit}
.btn{background:var(--pri);color:#fff;border:0;border-radius:16px;padding:12px 18px;margin:4px;box-shadow:0 4px 0 #b34e00;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b34e00}
.btn.alt{background:#4c6fff;box-shadow:0 4px 0 #2a45b8}.btn.gr{background:#8a94a8;box-shadow:0 4px 0 #5d667a}
.btn[disabled]{opacity:.5}
input,select{padding:10px;border-radius:12px;border:2px solid #cfd8ff;margin:4px}
.hero{font-size:4rem;text-align:center;animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.grades{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.path{display:flex;flex-direction:column;align-items:center;gap:4px}
.node{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:#eef2ff;border:3px solid #cfd8ff;text-align:left}
.node .ic{font-size:2rem}.node.cur{border-color:var(--pri);background:#fff3e6;animation:glow 1.2s infinite}
@keyframes glow{50%{box-shadow:0 0 18px 4px #ffd34d}}
.arrow{font-size:1.3rem}
.top{display:flex;justify-content:space-between;font-weight:600;flex-wrap:wrap}
.q{font-size:1.3rem;margin:10px 0}
.ch{display:block;width:100%;text-align:left;background:#f4f6ff;border:3px solid #cfd8ff;border-radius:16px;padding:12px;margin:8px 0;font-size:1.1rem;cursor:pointer}
.ch.ok{background:#d8f8e7;border-color:var(--ok)}.ch.no{background:#ffe0e8;border-color:var(--bad)}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.dot{width:36px;height:36px;border-radius:50%;border:2px solid #cfd8ff;background:#fff;font:inherit;cursor:pointer}
.dot.ans{background:#d8e4ff}.dot.cur{border-color:var(--pri);background:#fff3e6;font-weight:600}
.ch.sel{background:#e3ebff;border-color:#4c6fff}
.rv{padding:10px;border-radius:14px;margin:8px 0;border-left:6px solid}
.rv.ok{background:#e9fbf1;border-color:var(--ok)}.rv.no{background:#fff0f3;border-color:var(--bad)}
.fb{padding:12px;border-radius:16px;margin-top:8px;animation:pop .4s}
.fb.ok{background:#d8f8e7}.fb.no{background:#fff0d6}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.big{font-size:3.5rem;text-align:center;animation:pop .6s}
table{width:100%;border-collapse:collapse;font-size:.95rem}td,th{border-bottom:1px solid #dde3ff;padding:6px;text-align:center}
.bar{height:12px;background:#dde3ff;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.small{font-size:.85rem;opacity:.75}
</style></head><body><div id="app"></div>

["P1-H02","หน่วยที่ 1","มีหน้าต่างเด้งขึ้นมาบอกว่า “คุณได้รับรางวัล” ควรทำอย่างไร?","ไม่กด และบอกครู",["กดทันที","พิมพ์ชื่อและที่อยู่","ส่งให้เพื่อนดู"],"อาจเป็นการหลอกลวง ควรบอกผู้ใหญ่ก่อนเสมอ"],

["P1-E05","หน่วยที่ 1","การกดปุ่มเมาส์ซ้ายหนึ่งครั้งเพื่อเลือกสิ่งต่าง ๆ เรียกว่าอะไร?","คลิก",["พิมพ์","วาด","ลบ"],"การกดปุ่มเมาส์เพื่อเลือกเรียกว่า คลิก"],

["P1-M11","หน่วยที่ 2","จะพิมพ์ชื่อและเลขที่ของตัวเอง ควรใช้โปรแกรมใด?","โปรแกรมพิมพ์เอกสาร",["โปรแกรมวาดภาพ","โปรแกรมเล่นเพลง","โปรแกรมเกม"],"โปรแกรมพิมพ์เอกสารเหมาะกับการพิมพ์ตัวอักษร"],

const TARGET=180, D={E:'ง่าย',M:'ปานกลาง',H:'ยาก'}, DI={E:'🟢',M:'🟡',H:'🔴'}, GN=['1','2','3','4'];
const TITLE={1:'นักผจญภัยตัวน้อย',2:'นักแก้ปัญหาดิจิทัล',3:'นักรบอัลกอริทึม',4:'จอมยุทธ์ดิจิทัล'};
const bank=Q.map(a=>({id:a[0],g:a[0][1],d:a[0][3],grade:'ป.'+a[0][1],difficulty:D[a[0][3]],unit:a[1],question:a[2],answer:a[3],choices:[a[3],...a[4]],explanation:a[5]}));
const pool=(g,d)=>bank.filter(q=>q.g==g&&q.d==d);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S;try{S=JSON.parse(localStorage.getItem('dw'))}catch(e){}S=S||{name:'',prog:{},wrong:{},log:[]};
const save=()=>{try{localStorage.setItem('dw',JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id), app=$('app');
let tr='',grade=1,G=null,tf={g:'all',d:'all'},tOK=false;
const P=(g,d)=>S.prog[g+d]||{best:0,c:0,w:0,medal:'',passed:false};
const unlocked=(g,d)=>d=='E'||(d=='M'&&P(g,'E').passed)||(d=='H'&&P(g,'M').passed);
const medalOf=p=>p>=100?'🥇':p>=90?'🥈':p>=80?'🥉':'';

function home(){
app.innerHTML=`<h1>🎮 ผจญภัยโลกดิจิทัล<br>ตะลุยด่านพิชิตภารกิจ</h1><div class="hero">🧑‍🚀</div>
<div class="card"><b>ชื่อนักผจญภัย</b><br><input id="nm" placeholder="พิมพ์ชื่อของหนู" value="${esc(S.name)}">
<p><b>เลือกชั้นเรียน</b></p><div class="grades">${GN.map(g=>`<button class="btn ${g==grade?'':'alt'}" onclick="pickG(${g})">ป.${g}<br><small>${TITLE[g]}</small></button>`).join('')}</div>
<p style="text-align:center"><button class="btn" onclick="go()">▶ เริ่มผจญภัย</button></p>
<p style="text-align:center"><button class="btn gr" onclick="stats()">📊 สถิติการเล่น</button><button class="btn gr" onclick="teacher()">🔐 Teacher Mode</button></p></div>`}
function pickG(g){S.name=$('nm').value.trim();grade=g;home()}
function go(){S.name=($('nm').value.trim())||'นักผจญภัย';save();map()}

function map(){
const all=['E','M','H'].every(d=>P(grade,d).passed);
const node=(ic,t,sub,cls,act)=>`<div class="node ${cls}"><span class="ic">${ic}</span><div style="flex:1"><b>${t}</b><br><span class="small">${sub}</span></div>${act}</div>`;
const lv=(d,ic,city)=>{const p=P(grade,d),u=unlocked(grade,d),n=pool(grade,d).length;
return node(ic,`${city} · ${DI[d]} ${D[d]}`,p.passed?`ผ่านแล้ว ${p.medal} คะแนนสูงสุด ${p.best}`:u?`พร้อมลุย! (คลังข้อสอบ ${n} ข้อ)`:'ผ่านด่านก่อนหน้าเพื่อปลดล็อก',u&&!p.passed?'cur':'',
u?`<button class="btn" onclick="play('${d}')">${p.passed?'✅ เล่นอีก':'✨ เล่น'}</button>`:'<span class="ic">🔒</span>')};
const ar='<div class="arrow">↓</div>';
app.innerHTML=`<h1>🗺️ ป.${grade} ${TITLE[grade]}</h1><div class="card path">
${node('🏠','จุดเริ่มต้น',esc(S.name)+' พร้อมผจญภัย!','','<span class="ic">✅</span>')}${ar}
${lv('E','💻','เมืองคอมพิวเตอร์')}${ar}${lv('M','🤖','เมือง Coding')}${ar}${lv('H','🌐','โลกอินเทอร์เน็ต')}${ar}
${node('🧠','ดินแดนนักคิด','ทบทวนข้อที่ตอบผิด ('+Object.keys(S.wrong).length+' ข้อ)','',`<button class="btn alt" onclick="review()">ฝึก</button>`)}${ar}
${node('🏰','ปราสาทจอมยุทธ์ดิจิทัล',all?'🏆 สุดยอดนักผจญภัยดิจิทัล!':'ผ่านครบ 3 ระดับเพื่อรับตำแหน่ง',all?'cur':'',all?'<span class="ic">✅</span>':'<span class="ic">🔒</span>')}</div>
<button class="btn gr" onclick="home()">⬅ กลับ</button><button class="btn gr" onclick="stats()">📊 สถิติ</button>`}

function play(d,rv){
const qs=rv||sh(pool(grade,d)).slice(0,10);
if(!qs.length)return;
G={d,qs,i:0,a:qs.map(()=>null),ch:qs.map(q=>sh(q.choices)),rv:!!rv,force:false};show()}
function review(){const qs=sh(bank.filter(q=>S.wrong[q.id])).slice(0,10);
if(!qs.length){app.innerHTML=`<div class="card"><div class="big">🌟</div><p style="text-align:center">ยังไม่มีข้อที่ตอบผิด เก่งมาก!</p><button class="btn" onclick="map()">กลับแผนที่</button></div>`;return}
play(null,qs)}
function show(){
const q=G.qs[G.i],n=G.qs.length,last=G.i==n-1,done=G.a.filter(x=>x!==null).length;
app.innerHTML=`<div class="card"><div class="top"><span>ข้อ ${G.i+1} / ${n}</span><span>ตอบแล้ว ${done} / ${n}</span></div>
<div class="bar"><i style="width:${done/n*100}%"></i></div>
<div class="nav">${G.qs.map((_,k)=>`<button class="dot ${k==G.i?'cur':''} ${G.a[k]!==null?'ans':''}" onclick="G.i=${k};show()">${k+1}</button>`).join('')}</div>
<div class="q">📌 ${esc(q.question)}</div>
${G.ch[G.i].map((c,i)=>`<button class="ch ${G.a[G.i]===c?'sel':''}" onclick="pick(${i})">${'ABCD'[i]}. ${esc(c)}</button>`).join('')}
<p style="text-align:center"><button class="btn gr" ${G.i?'':'disabled'} onclick="G.i--;show()">⬅ ย้อนกลับ</button>${last?`<button class="btn" onclick="submit()">📤 ส่งคำตอบ</button>`:`<button class="btn" onclick="G.i++;show()">ข้อต่อไป ➡</button>`}</p>
<p class="small" style="text-align:center">กดตัวเลขด้านบนเพื่อกลับไปแก้ข้อใดก็ได้ · เฉลยจะแสดงหลังส่งคำตอบ</p></div>`}
function goNext(g,d){grade=g;play(d)}
function pick(i){G.a[G.i]=G.ch[G.i][i];show()}
function submit(){
const blank=G.a.map((x,i)=>x===null?i+1:0).filter(Boolean);
if(blank.length&&!G.force){app.innerHTML=`<div class="card"><div class="big">📝</div><p style="text-align:center">ยังไม่ได้ตอบข้อ ${blank.join(', ')}</p><p style="text-align:center"><button class="btn alt" onclick="G.i=${blank[0]-1};show()">กลับไปทำต่อ</button><button class="btn gr" onclick="G.force=true;submit()">ส่งเลย</button></p></div>`;return}
finish()}
function finish(){
const n=G.qs.length,c=G.qs.filter((q,i)=>G.a[i]===q.answer).length,w=n-c,score=c*10,pct=Math.round(c/n*100),pass=pct>=80,m=pass?medalOf(pct):'';
G.qs.forEach((q,i)=>{if(G.a[i]===q.answer){if(G.rv)delete S.wrong[q.id]}else S.wrong[q.id]=(S.wrong[q.id]||0)+1});
if(!G.rv){const k=grade+G.d,p=P(grade,G.d);
S.prog[k]={best:Math.max(p.best,score),c:p.c+c,w:p.w+w,medal:(m&&(!p.medal||pct>=({'🥉':80,'🥈':90,'🥇':100}[p.medal])))?m:p.medal,passed:p.passed||pass};
S.log.push({n:S.name,g:grade,d:G.d,pct,c,w,t:new Date().toLocaleDateString('th-TH')})}
save();
let nx='';
if(pass&&!G.rv){const ng=G.d=='H'?grade+1:grade,nd={E:'M',M:'H',H:'E'}[G.d];
if(ng<=4)nx=`<button class="btn" onclick="goNext(${ng},'${nd}')">▶ ด่านต่อไป: ${ng!=grade?'ป.'+ng+' ':''}${DI[nd]} ${D[nd]}</button>`;
else nx='<div class="big">🏰</div><p style="text-align:center"><b>พิชิตทุกชั้นแล้ว! ยินดีต้อนรับสู่ปราสาทจอมยุทธ์ดิจิทัล</b></p>';
if(['E','M','H'].every(x=>P(grade,x).passed))nx+=`<p style="text-align:center">🏆 สุดยอดนักผจญภัยดิจิทัล ป.${grade}!</p>`}
const key=G.qs.map((q,i)=>{const a=G.a[i],ok=a===q.answer;return `<div class="rv ${ok?'ok':'no'}"><b>ข้อ ${i+1} ${ok?'✅ ถูก':'❌ ผิด'}</b> ${esc(q.question)}<br>คำตอบของหนู: ${a===null?'ไม่ได้ตอบ':esc(a)}<br>เฉลย: <b>${esc(q.answer)}</b><br><span class="small">💡 ${esc(q.explanation)}</span></div>`}).join('');
app.innerHTML=`<div class="card"><div class="big">${pass?'🎉':'💪'}</div>
<h2 style="text-align:center">${pass?'ผ่านด่านแล้ว!':'ลองอีกครั้งนะ นักผจญภัย!'}</h2>
<p style="text-align:center">${pass?`ได้ ${m} · ${pct}% · ปลดล็อกด่านถัดไป ✨`:'ทบทวนความรู้แล้วกลับมาพิชิตด่านอีกครั้ง'}<br>ถูก ${c} ข้อ ผิด ${w} ข้อ · ${score} คะแนน</p>
<p style="text-align:center">${nx}</p><p style="text-align:center">${G.rv?'':`<button class="btn ${pass?'gr':''}" onclick="play('${G.d}')">🔄 เล่นอีกครั้ง</button>`}<button class="btn alt" onclick="map()">🗺️ แผนที่</button></p></div>
<div class="card"><b>📖 เฉลยและคำอธิบาย</b>${key}</div>`}

function stats(){
const rows=[1,2,3,4].flatMap(g=>['E','M','H'].map(d=>{const p=S.prog[g+d]||{best:0,c:0,w:0,medal:'',passed:false};
return `<tr><td>ป.${g}</td><td>${DI[d]} ${D[d]}</td><td>${p.best}</td><td>${p.c}</td><td>${p.w}</td><td>${p.medal||'-'}</td><td>${p.passed?'✅':(g==grade||p.c+p.w)?'⏳':'🔒'}</td></tr>`}));
app.innerHTML=`<h1>📊 สถิติการเล่น</h1><div class="card"><b>ผู้เล่น: ${esc(S.name||'-')}</b><div style="overflow-x:auto"><table><tr><th>ชั้น</th><th>ระดับ</th><th>สูงสุด</th><th>ถูก</th><th>ผิด</th><th>เหรียญ</th><th>สถานะ</th></tr>${rows.join('')}</table></div>
<p><button class="btn alt" onclick="review()">🧠 ทบทวนข้อที่ตอบผิด (${Object.keys(S.wrong).length})</button><button class="btn gr" onclick="home()">⬅ กลับ</button></p></div>`}

function doReset(){S.prog={};S.wrong={};if(tr=='a')S.log=[];tr='';save();teacher()}
function teacher(){
if(!tOK){app.innerHTML=`<h1>🔐 Teacher Mode</h1><div class="card">รหัสครู: <input id="pin" type="password" inputmode="numeric" placeholder="รหัส 4 หลัก"><button class="btn" onclick="if($('pin').value=='1234'){tOK=true;teacher()}else $('pe').textContent='รหัสไม่ถูกต้อง'">เข้าสู่ระบบ</button><div id="pe" style="color:#ef476f"></div><button class="btn gr" onclick="home()">⬅ กลับ</button></div>`;return}
const f=x=>(tf.g=='all'||x.g==tf.g)&&(tf.d=='all'||x.d==tf.d);
const cnt=(g,d)=>pool(g,d).length;
const logs=S.log.filter(f),wrongs=bank.filter(q=>S.wrong[q.id]&&f(q)).sort((a,b)=>S.wrong[b.id]-S.wrong[a.id]).slice(0,8);
const avg=logs.length?Math.round(logs.reduce((s,x)=>s+x.pct,0)/logs.length):0;
app.innerHTML=`<h1>👨‍🏫 โหมดครู</h1><div class="card"><b>คลังข้อสอบ: ${bank.length} / ${TARGET} ข้อ</b>
<table><tr><th></th><th>ง่าย</th><th>ปานกลาง</th><th>ยาก</th></tr>${[1,2,3,4].map(g=>`<tr><td>ป.${g}</td>${['E','M','H'].map(d=>`<td>${cnt(g,d)}/15</td>`).join('')}</tr>`).join('')}</table></div>
<div class="card"><b>กรองผล</b> <select onchange="tf.g=this.value;teacher()"><option value="all">ทุกชั้น</option>${[1,2,3,4].map(g=>`<option value="${g}" ${tf.g==g?'selected':''}>ป.${g}</option>`).join('')}</select>
<select onchange="tf.d=this.value;teacher()"><option value="all">ทุกระดับ</option>${['E','M','H'].map(d=>`<option value="${d}" ${tf.d==d?'selected':''}>${D[d]}</option>`).join('')}</select>
<p>การเล่น ${logs.length} รอบ · ผ่าน ${logs.filter(x=>x.pct>=80).length} รอบ · คะแนนเฉลี่ย ${avg}%</p>
<div style="overflow-x:auto"><table><tr><th>ชื่อ</th><th>ชั้น/ระดับ</th><th>%</th><th>ถูก/ผิด</th><th>วันที่</th></tr>${logs.slice(-15).reverse().map(x=>`<tr><td>${esc(x.n)}</td><td>ป.${x.g} ${D[x.d]}</td><td>${x.pct}%</td><td>${x.c}/${x.w}</td><td>${x.t}</td></tr>`).join('')||'<tr><td colspan=5>ยังไม่มีข้อมูล</td></tr>'}</table></div>
<p><b>ข้อที่ตอบผิดบ่อย</b></p>${wrongs.map(q=>`<div class="small">• [${q.id}] ${esc(q.question)} — ผิด ${S.wrong[q.id]} ครั้ง</div>`).join('')||'<div class="small">ยังไม่มี</div>'}
<p class="small">ข้อมูลเก็บในเบราว์เซอร์เครื่องนี้เท่านั้น</p><button class="btn gr" onclick="tOK=false;tr='';home()">ออก</button></div>
<div class="card"><b>🔄 รีเซ็ตด่าน</b><p class="small">ให้นักเรียนเริ่มต้นใหม่ทุกด่านบนเครื่องนี้ (ด่านที่ผ่าน เหรียญ คะแนนสูงสุด และรายการข้อที่ตอบผิดจะถูกล้าง)</p>
${tr?`<p><b>${tr=='a'?'ล้างทุกอย่างรวมรายงานของครู':'รีเซ็ตทุกด่าน (เก็บรายงานของครูไว้)'} — ยืนยันหรือไม่? ย้อนกลับไม่ได้</b></p><button class="btn" style="background:#ef476f;box-shadow:0 4px 0 #a82746" onclick="doReset()">ยืนยัน</button><button class="btn gr" onclick="tr='';teacher()">ยกเลิก</button>`:`<button class="btn" onclick="tr='p';teacher()">🔄 รีเซ็ตทุกด่าน</button><button class="btn gr" onclick="tr='a';teacher()">🗑️ ล้างทุกอย่างรวมรายงาน</button>`}</div>`}
home();
</script></body></html>
